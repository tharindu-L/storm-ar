<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>STORM — Environmental & Seismic AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <!-- AR.js for A-Frame (marker-based) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', monospace;
      background: #000;
      color: #00ff88;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* ── HUD Overlay ── */
    #hud {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      z-index: 9999;
      pointer-events: none;
    }

    #hud-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.75);
      border-bottom: 1px solid #00ff8844;
      padding: 8px 14px;
      pointer-events: all;
    }

    #hud-title {
      font-size: 13px;
      letter-spacing: 3px;
      color: #00ff88;
      text-transform: uppercase;
    }

    #location-search-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      margin-right: 12px;
    }

    #location-search {
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid #00ff8844;
      color: #00ff88;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      padding: 6px 10px;
      width: min(280px, 32vw);
      min-width: 160px;
      outline: none;
    }

    #location-search::placeholder {
      color: #00ff8877;
    }

    #location-search-btn,
    #mode-toggle {
      background: #00ff8822;
      border: 1px solid #00ff88;
      color: #00ff88;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      padding: 5px 12px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s;
    }
    #location-search-btn:hover,
    #mode-toggle:hover { background: #00ff8844; }

    #data-panel {
      display: flex;
      gap: 10px;
      padding: 8px 14px;
      background: rgba(0, 0, 0, 0.6);
      border-bottom: 1px solid #00ff8822;
      flex-wrap: wrap;
      pointer-events: none;
    }

    .data-card {
      background: rgba(0, 255, 136, 0.05);
      border: 1px solid #00ff8833;
      padding: 6px 10px;
      min-width: 120px;
      flex: 1;
    }

    .data-card .label {
      font-size: 9px;
      letter-spacing: 2px;
      color: #00ff8899;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .data-card .value {
      font-size: 14px;
      color: #00ff88;
    }

    .data-card .sub {
      font-size: 10px;
      color: #00ff8877;
      margin-top: 2px;
    }

    /* status dot */
    #status-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #00ff88;
      margin-right: 6px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    #mode-label {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      border: 1px solid #00ff8844;
      color: #00ff8899;
      font-size: 10px;
      letter-spacing: 2px;
      padding: 5px 14px;
      text-transform: uppercase;
      z-index: 9999;
      pointer-events: none;
    }

    #last-update {
      position: fixed;
      bottom: 56px;
      right: 14px;
      font-size: 9px;
      color: #00ff8855;
      z-index: 9999;
      letter-spacing: 1px;
    }

    /* ── Scenes ── */
    #scene-marker, #scene-markerless {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    #scene-markerless { display: none; }

    /* markerless tap hint */
    #tap-hint {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      border: 1px solid #00ff8844;
      color: #00ff88aa;
      font-size: 10px;
      letter-spacing: 2px;
      padding: 5px 14px;
      z-index: 9999;
      display: none;
      text-transform: uppercase;
    }

    /* quake legend */
    #quake-legend {
      position: fixed;
      top: 110px;
      right: 14px;
      background: rgba(0,0,0,0.7);
      border: 1px solid #00ff8833;
      padding: 8px 12px;
      z-index: 9999;
      display: none;
      pointer-events: none;
    }
    #quake-legend .leg-title {
      font-size: 9px;
      letter-spacing: 2px;
      color: #00ff8888;
      margin-bottom: 6px;
    }
    .leg-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      color: #00ff8877;
      margin-bottom: 3px;
    }
    .leg-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════
     HUD
═══════════════════════════════════════════ -->
<div id="hud">
  <div id="hud-bar">
    <span id="hud-title">
      <span id="status-dot"></span>STORM v1.0
    </span>

    <div id="location-search-wrap">
      <input id="location-search" type="text" placeholder="Search any location" aria-label="Search weather location" />
      <button id="location-search-btn" type="button">Search</button>
    </div>

    <button id="mode-toggle" onclick="toggleMode()">⇄ QUAKE-GRID</button>
  </div>
  <div id="data-panel">
    <div class="data-card" id="card-weather">
      <div class="label">Weather</div>
      <div class="value" id="w-temp">—°C</div>
      <div class="sub" id="w-cond">Fetching…</div>
    </div>
    <div class="data-card" id="card-wind">
      <div class="label">Wind</div>
      <div class="value" id="w-wind">— km/h</div>
      <div class="sub" id="w-dir">—</div>
    </div>
    <div class="data-card" id="card-quake">
      <div class="label">Latest Quake</div>
      <div class="value" id="q-mag">M —</div>
      <div class="sub" id="q-place">Fetching…</div>
    </div>
    <div class="data-card" id="card-quake2">
      <div class="label">Depth / Count</div>
      <div class="value" id="q-depth">— km</div>
      <div class="sub" id="q-count">— events (24h)</div>
    </div>
  </div>
</div>

<div id="mode-label">MODE: WEATHER-GLOBE — AIM AT HIRO MARKER</div>
<div id="last-update">LAST UPDATE: —</div>
<div id="tap-hint">TAP SCREEN TO PLACE QUAKE-GRID</div>
<button id="enter-ar-btn" onclick="_enterARSession()" style="
  display: none;
  position: fixed;
  bottom: 130px;
  left: 50%;
  transform: translateX(-50%);
  background: #00ff8822;
  border: 1px solid #00ff88;
  color: #00ff88;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  letter-spacing: 3px;
  padding: 10px 28px;
  cursor: pointer;
  text-transform: uppercase;
  z-index: 9999;
  animation: pulse 1.5s infinite;
">⬡ ENTER AR</button>

<div id="quake-legend">
  <div class="leg-title">DEPTH COLOUR</div>
  <div class="leg-row"><div class="leg-dot" style="background:#00ff44"></div>&lt; 30 km (shallow)</div>
  <div class="leg-row"><div class="leg-dot" style="background:#ffaa00"></div>30–70 km (mid)</div>
  <div class="leg-row"><div class="leg-dot" style="background:#ff3300"></div>&gt; 70 km (deep)</div>
  <div class="leg-title" style="margin-top:6px">SPHERE SIZE</div>
  <div class="leg-row">radius = magnitude × 0.04</div>
</div>

<!-- ══════════════════════════════════════════
     SCENE A — MARKER-BASED (weather-globe)
     Uses AR.js + A-Frame marker tracking.
     Anchor: Hiro marker.
═══════════════════════════════════════════ -->
<a-scene
  id="scene-marker"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false;"
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; colorManagement: true;"
  loading-screen="enabled: false"
>
  <a-assets>
    <!-- Inline geometries only; no external model files needed -->
  </a-assets>

  <!-- Hiro marker anchor -->
  <a-marker preset="hiro" id="hiro-marker">
    <!-- weather-globe root — rebuilt by JS on each data refresh -->
    <a-entity id="weather-globe-root" position="0 0.05 0" scale="0.45 0.45 0.45" rotation="90 180 0">

            <!-- SUN group — layered glow + dual rotation -->
      <a-entity id="wg-sun" visible="true" position="0 1.3 0">
        <!-- outer glow ring -->
        <a-torus color="#FFE566" radius="0.62" radius-tubular="0.045"
          material="emissive:#FFD700;emissiveIntensity:0.4;opacity:0.35;transparent:true;side:double">
          <a-animation attribute="rotation" from="0 0 0" to="0 0 360" dur="18000" loop="true" easing="linear"></a-animation>
        </a-torus>
        <!-- inner glow halo -->
        <a-sphere color="#FFE566" radius="0.58"
          material="emissive:#FFD700;emissiveIntensity:0.18;opacity:0.18;transparent:true">
        </a-sphere>
        <!-- core body — slow pulse -->
        <a-sphere color="#FFD700" radius="0.46"
          material="emissive:#FFB300;emissiveIntensity:0.7;metalness:0;roughness:0.4">
          <a-animation attribute="scale" from="1 1 1" to="1.06 1.06 1.06" dur="2200" direction="alternate" repeat="indefinite" easing="easeInOutSine"></a-animation>
        </a-sphere>
        <!-- highlight spot -->
        <a-sphere color="#FFF9C4" radius="0.16" position="-0.16 0.2 0.38"
          material="emissive:#ffffff;emissiveIntensity:0.6;opacity:0.55;transparent:true">
        </a-sphere>
        <!-- rays wrapper — rotates independently -->
        <a-entity animation="property: rotation; from: 0 0 0; to: 0 0 360; dur: 10000; loop: true; easing: linear">
          <a-cone color="#FFD700" radius-bottom="0.09" radius-top="0.01" height="0.32" position="0 0.72 0"          material="emissive:#FFD700;emissiveIntensity:0.9;opacity:0.85;transparent:true"></a-cone>
          <a-cone color="#FFD700" radius-bottom="0.09" radius-top="0.01" height="0.32" position="0 -0.72 0"         rotation="0 0 180" material="emissive:#FFD700;emissiveIntensity:0.9;opacity:0.85;transparent:true"></a-cone>
          <a-cone color="#FFD700" radius-bottom="0.09" radius-top="0.01" height="0.32" position="0.72 0 0"          rotation="0 0 -90" material="emissive:#FFD700;emissiveIntensity:0.9;opacity:0.85;transparent:true"></a-cone>
          <a-cone color="#FFD700" radius-bottom="0.09" radius-top="0.01" height="0.32" position="-0.72 0 0"         rotation="0 0 90"  material="emissive:#FFD700;emissiveIntensity:0.9;opacity:0.85;transparent:true"></a-cone>
          <a-cone color="#FFCC00" radius-bottom="0.075" radius-top="0.01" height="0.26" position="0.51 0.51 0"      rotation="0 0 -45" material="emissive:#FFD700;emissiveIntensity:0.8;opacity:0.75;transparent:true"></a-cone>
          <a-cone color="#FFCC00" radius-bottom="0.075" radius-top="0.01" height="0.26" position="-0.51 0.51 0"     rotation="0 0 45"  material="emissive:#FFD700;emissiveIntensity:0.8;opacity:0.75;transparent:true"></a-cone>
          <a-cone color="#FFCC00" radius-bottom="0.075" radius-top="0.01" height="0.26" position="0.51 -0.51 0"     rotation="0 0 -135" material="emissive:#FFD700;emissiveIntensity:0.8;opacity:0.75;transparent:true"></a-cone>
          <a-cone color="#FFCC00" radius-bottom="0.075" radius-top="0.01" height="0.26" position="-0.51 -0.51 0"    rotation="0 0 135" material="emissive:#FFD700;emissiveIntensity:0.8;opacity:0.75;transparent:true"></a-cone>
        </a-entity>
      </a-entity>

      <!-- CLOUD group (left) -->
      <a-entity id="wg-cloud" visible="false" position="-0.72 0.68 0"
        animation="property: position; from: -0.9 0.68 0; to: -0.5 0.68 0; dur: 5000; dir: alternate; loop: true; easing: easeInOutSine">
        <a-sphere color="#f0f4ff" radius="0.30" position="0 0 0"       material="emissive:#c8d4f0;emissiveIntensity:0.18"></a-sphere>
        <a-sphere color="#e8eeff" radius="0.24" position="0.26 -0.05 0" material="emissive:#c8d4f0;emissiveIntensity:0.15"></a-sphere>
        <a-sphere color="#e8eeff" radius="0.22" position="-0.24 -0.05 0" material="emissive:#c8d4f0;emissiveIntensity:0.15"></a-sphere>
        <a-sphere color="#dde4ff" radius="0.16" position="0 -0.22 0"   material="emissive:#aab4d8;emissiveIntensity:0.1"></a-sphere>
        <a-animation attribute="position" from="-0.72 0.68 0" to="-0.72 0.76 0" dur="3000" direction="alternate" repeat="indefinite" easing="easeInOutSine"></a-animation>
      </a-entity>

      <!-- CLOUD group (right) -->
      <a-entity id="wg-cloud-right" visible="false" position="0.72 0.72 0"
        animation="property: position; from: 0.5 0.72 0; to: 0.9 0.72 0; dur: 4000; dir: alternate; loop: true; easing: easeInOutSine">
        <a-sphere color="#f0f4ff" radius="0.26" position="0 0 0"       material="emissive:#c8d4f0;emissiveIntensity:0.15"></a-sphere>
        <a-sphere color="#e8eeff" radius="0.20" position="0.22 -0.04 0" material="emissive:#c8d4f0;emissiveIntensity:0.12"></a-sphere>
        <a-sphere color="#e8eeff" radius="0.18" position="-0.20 -0.04 0" material="emissive:#c8d4f0;emissiveIntensity:0.12"></a-sphere>
        <a-animation attribute="position" from="0.72 0.72 0" to="0.72 0.79 0" dur="3600" direction="alternate" repeat="indefinite" easing="easeInOutSine"></a-animation>
      </a-entity>

      <!-- RAIN group -->
      <a-entity id="wg-rain" visible="false" position="0 0.9 0"
        animation="property: position; from: -0.4 0.9 0; to: 0.4 0.9 0; dur: 4000; dir: alternate; loop: true; easing: easeInOutSine">
        <a-sphere color="#7a8fa8" radius="0.30" position="0 0.12 0"    material="emissive:#445566;emissiveIntensity:0.15"></a-sphere>
        <a-sphere color="#8a9fb8" radius="0.24" position="0.24 0.06 0"  material="emissive:#445566;emissiveIntensity:0.12"></a-sphere>
        <a-sphere color="#8a9fb8" radius="0.22" position="-0.22 0.06 0" material="emissive:#445566;emissiveIntensity:0.12"></a-sphere>
        <a-sphere color="#6a7f98" radius="0.18" position="0.44 0.02 0"  material="emissive:#445566;emissiveIntensity:0.1"></a-sphere>
        <!-- 5 raindrops with staggered delay -->
        <a-box color="#66aaff" width="0.022" height="0.13" depth="0.022" material="emissive:#3366cc;emissiveIntensity:0.6;opacity:0.85;transparent:true">
          <a-animation attribute="position" from="-0.18 -0.08 0" to="-0.18 -0.42 0" dur="800" repeat="indefinite" easing="linear"></a-animation>
        </a-box>
        <a-box color="#66aaff" width="0.022" height="0.13" depth="0.022" material="emissive:#3366cc;emissiveIntensity:0.6;opacity:0.85;transparent:true">
          <a-animation attribute="position" from="-0.06 -0.08 0" to="-0.06 -0.42 0" dur="800" delay="160" repeat="indefinite" easing="linear"></a-animation>
        </a-box>
        <a-box color="#66aaff" width="0.022" height="0.13" depth="0.022" material="emissive:#3366cc;emissiveIntensity:0.6;opacity:0.85;transparent:true">
          <a-animation attribute="position" from="0.06 -0.08 0" to="0.06 -0.42 0" dur="800" delay="320" repeat="indefinite" easing="linear"></a-animation>
        </a-box>
        <a-box color="#66aaff" width="0.022" height="0.13" depth="0.022" material="emissive:#3366cc;emissiveIntensity:0.6;opacity:0.85;transparent:true">
          <a-animation attribute="position" from="0.18 -0.08 0" to="0.18 -0.42 0" dur="800" delay="480" repeat="indefinite" easing="linear"></a-animation>
        </a-box>
        <a-box color="#66aaff" width="0.022" height="0.13" depth="0.022" material="emissive:#3366cc;emissiveIntensity:0.6;opacity:0.85;transparent:true">
          <a-animation attribute="position" from="0.30 -0.08 0" to="0.30 -0.42 0" dur="800" delay="640" repeat="indefinite" easing="linear"></a-animation>
        </a-box>
      </a-entity>

      <!-- LIGHTNING group — tucked under rain cloud -->
      <a-entity id="wg-lightning" visible="false" position="0 0.55 0.02"
        animation="property: position; from: -0.1 0.55 0.02; to: 0.1 0.55 0.02; dur: 3000; dir: alternate; loop: true; easing: easeInOutSine">
        <a-box color="#ffe600" width="0.09" height="0.32" depth="0.04" position="-0.03 0.06 0"  rotation="0 0 -22" material="emissive:#ffe600;emissiveIntensity:1.0">
          <a-animation attribute="material.opacity" from="1" to="0.3" dur="400" direction="alternate" repeat="indefinite" easing="easeInOutQuad"></a-animation>
        </a-box>
        <a-box color="#ffe600" width="0.09" height="0.32" depth="0.04" position="0.05 -0.2 0"   rotation="0 0 22"  material="emissive:#ffe600;emissiveIntensity:1.0">
          <a-animation attribute="material.opacity" from="1" to="0.3" dur="400" delay="200" direction="alternate" repeat="indefinite" easing="easeInOutQuad"></a-animation>
        </a-box>
      </a-entity>

      <!-- YARD — richer green with subtle gradient via two planes -->
      <a-plane
        id="wg-yard"
        color="#3dba5e"
        width="2.0"
        height="1.3"
        position="0 -0.26 0.08"
        rotation="-90 0 0"
        material="emissive:#1a6e32;emissiveIntensity:0.22;roughness:1;side:double"
      ></a-plane>
      <!-- yard edge shadow strip -->
      <a-plane
        color="#1a5c28"
        width="2.0"
        height="0.12"
        position="0 -0.26 -0.57"
        rotation="-90 0 0"
        material="emissive:#0d3318;emissiveIntensity:0.1;opacity:0.55;transparent:true;side:double"
      ></a-plane>

      <!-- PATH — stone walkway to door -->
      <a-plane
        color="#b0a090"
        width="0.14"
        height="0.38"
        position="0 -0.255 -0.08"
        rotation="-90 0 0"
        material="emissive:#887060;emissiveIntensity:0.1;roughness:1;side:double"
      ></a-plane>

      <!-- HOUSE group — more detail -->
      <a-entity id="wg-home" position="0 -0.25 0.08">
        <!-- walls -->
        <a-box color="#e8c49a" width="0.54" height="0.40" depth="0.40" position="0 0.20 0"
          material="emissive:#c8a070;emissiveIntensity:0.12;roughness:0.85"></a-box>
        <!-- roof -->
        <a-cone color="#c0392b" radius-bottom="0.46" radius-top="0" height="0.38" position="0 0.57 0" rotation="0 45 0"
          material="emissive:#922b21;emissiveIntensity:0.15;roughness:0.7"></a-cone>
        <!-- chimney -->
        <a-box color="#8a6a50" width="0.08" height="0.22" depth="0.08" position="0.18 0.66 0"
          material="emissive:#5a4030;emissiveIntensity:0.1"></a-box>
        <!-- door -->
        <a-box color="#6b4226" width="0.13" height="0.22" depth="0.03" position="0 0.12 -0.21"
          material="emissive:#3d2010;emissiveIntensity:0.08"></a-box>
        <!-- door knob -->
        <a-sphere color="#f0c040" radius="0.018" position="0.055 0.12 -0.225"
          material="emissive:#d4a000;emissiveIntensity:0.5"></a-sphere>
        <!-- windows — with frame -->
        <a-box color="#a8d8f0" width="0.13" height="0.12" depth="0.03" position="-0.17 0.25 -0.21"
          material="emissive:#5599cc;emissiveIntensity:0.25"></a-box>
        <a-box color="#a8d8f0" width="0.13" height="0.12" depth="0.03" position="0.17 0.25 -0.21"
          material="emissive:#5599cc;emissiveIntensity:0.25"></a-box>
        <!-- window cross bars -->
        <a-box color="#d8b880" width="0.015" height="0.12" depth="0.035" position="-0.17 0.25 -0.215"
          material="emissive:#aa8840;emissiveIntensity:0.1"></a-box>
        <a-box color="#d8b880" width="0.13" height="0.015" depth="0.035" position="-0.17 0.25 -0.215"
          material="emissive:#aa8840;emissiveIntensity:0.1"></a-box>
        <a-box color="#d8b880" width="0.015" height="0.12" depth="0.035" position="0.17 0.25 -0.215"
          material="emissive:#aa8840;emissiveIntensity:0.1"></a-box>
        <a-box color="#d8b880" width="0.13" height="0.015" depth="0.035" position="0.17 0.25 -0.215"
          material="emissive:#aa8840;emissiveIntensity:0.1"></a-box>
      </a-entity>

      <!-- TREE (right) — fuller canopy -->
      <a-entity id="wg-tree" position="0.82 -0.25 0.08">
        <a-cylinder color="#6b4423" radius="0.055" height="0.38" position="0 0.19 0"
          material="emissive:#3d2510;emissiveIntensity:0.1"></a-cylinder>
        <!-- canopy layers -->
        <a-sphere color="#2dbd55" radius="0.22" position="0 0.46 0"
          material="emissive:#1a8a35;emissiveIntensity:0.18"></a-sphere>
        <a-sphere color="#38d460" radius="0.17" position="-0.15 0.40 0"
          material="emissive:#22a040;emissiveIntensity:0.15"></a-sphere>
        <a-sphere color="#38d460" radius="0.17" position="0.15 0.40 0"
          material="emissive:#22a040;emissiveIntensity:0.15"></a-sphere>
        <a-sphere color="#52e876" radius="0.13" position="0 0.60 0"
          material="emissive:#30bb50;emissiveIntensity:0.12"></a-sphere>
      </a-entity>

      <!-- SECOND TREE (left, smaller) -->
      <a-entity position="-0.80 -0.25 0.14">
        <a-cylinder color="#7a5030" radius="0.04" height="0.28" position="0 0.14 0"
          material="emissive:#3d2510;emissiveIntensity:0.1"></a-cylinder>
        <a-sphere color="#28a84a" radius="0.17" position="0 0.36 0"
          material="emissive:#1a6e30;emissiveIntensity:0.15"></a-sphere>
        <a-sphere color="#34c45a" radius="0.13" position="-0.11 0.31 0"
          material="emissive:#22a040;emissiveIntensity:0.12"></a-sphere>
        <a-sphere color="#34c45a" radius="0.12" position="0.10 0.31 0"
          material="emissive:#22a040;emissiveIntensity:0.12"></a-sphere>
      </a-entity>

      <!-- Temperature label -->
      <a-text
        id="wg-temp-label"
        value="—°C"
        align="center"
        color="#ffffff"
        width="3"
        position="0 -0.6 0.5"
        rotation="0 -180 0"
        material="emissive:#ffffff;emissiveIntensity:0.5"
      ></a-text>

      <!-- Condition label -->
      <a-text
        id="wg-cond-label"
        value="LOADING"
        align="center"
        color="#aaffcc"
        width="2.2"
        position="0 -0.9 0.5"
        rotation="0 -180 0"
      ></a-text>
    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<!-- ══════════════════════════════════════════
     SCENE B — MARKERLESS (quake-grid)
     WebXR immersive-ar + hit-test via Three.js
     Requires: Chrome on Android + ARCore
═══════════════════════════════════════════ -->
<div id="scene-markerless" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:1;">
  <canvas id="xr-canvas" style="position:absolute; top:0; left:0; width:100%; height:100%; display:block;"></canvas>
</div>

<!-- ══════════════════════════════════════════
     STORM — Core Logic
═══════════════════════════════════════════ -->
<script>
'use strict';

// ── Config ──────────────────────────────────────────────────────────────────
const CFG = {
  // Open-Meteo: Colombo, Sri Lanka as default field location
  // Researchers can modify lat/lon at runtime via URL params
  weatherLat:  parseFloat(new URLSearchParams(location.search).get('lat')  ?? '6.9271'),
  weatherLon:  parseFloat(new URLSearchParams(location.search).get('lon')  ?? '79.8612'),
  weatherCity: new URLSearchParams(location.search).get('city') ?? 'Colombo',

  // USGS last 24h M1.0+ worldwide
    usgsUrl: 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson',

  openMeteoUrl(lat, lon) {
    return `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
           `&current=temperature_2m,weathercode,windspeed_10m,winddirection_10m&timezone=auto`;
  },

  updateIntervalMs: 30_000,

  // quake-grid layout
  gridCols: 5,
  gridRows: 5,
  cellSize: 0.3,          // metres per cell
  sphereScale: 0.04,      // radius = magnitude * scale
  depthShallow: 30,       // km
  depthMid:     70,
};

// ── State ────────────────────────────────────────────────────────────────────
const STATE = {
  mode: 'marker',         // 'marker' | 'markerless'
  weather: null,
  quakes: [],
  gridAnchored: false,
  xrSession: null,
  xrHitTestSource: null,
  xrRefSpace: null,
  reticlePose: null,
};

// ── WMO weather-code → condition string ──────────────────────────────────────
const WMO_CODES = {
  0: 'CLEAR SKY', 1: 'MAINLY CLEAR', 2: 'PARTLY CLOUDY', 3: 'OVERCAST',
  45: 'FOGGY', 48: 'RIME FOG',
  51: 'LIGHT DRIZZLE', 53: 'DRIZZLE', 55: 'HEAVY DRIZZLE',
  61: 'LIGHT RAIN', 63: 'RAIN', 65: 'HEAVY RAIN',
  71: 'LIGHT SNOW', 73: 'SNOW', 75: 'HEAVY SNOW', 77: 'SNOW GRAINS',
  80: 'LIGHT SHOWERS', 81: 'SHOWERS', 82: 'HEAVY SHOWERS',
  85: 'SNOW SHOWERS', 86: 'HEAVY SNOW SHOWERS',
  95: 'THUNDERSTORM', 96: 'TSTORM + HAIL', 99: 'TSTORM + HEAVY HAIL',
};

function wmoToIcon(code) {
  if (code === 0 || code === 1)            return 'sun';
  if (code >= 2  && code <= 48)            return 'cloud';
  return 'rain';
}

function wmoToString(code) {
  return WMO_CODES[code] ?? `CODE ${code}`;
}

function setLocationLabel(cityName) {
  const input = document.getElementById('location-search');
  if (input) input.value = cityName || CFG.weatherCity;
}

async function searchLocation() {
  const input = document.getElementById('location-search');
  const query = (input?.value || '').trim();
  if (!query) {
    document.getElementById('mode-label').textContent = 'SEARCH — ENTER A CITY OR COUNTRY';
    return;
  }

  try {
    const geocodeUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`;
    const res = await fetch(geocodeUrl);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const json = await res.json();
    const result = json.results && json.results[0];

    if (!result) {
      document.getElementById('mode-label').textContent = 'SEARCH — LOCATION NOT FOUND';
      return;
    }

    CFG.weatherLat = Number(result.latitude);
    CFG.weatherLon = Number(result.longitude);
    CFG.weatherCity = result.name || 'Unknown';
    setLocationLabel(CFG.weatherCity);
    document.getElementById('mode-label').textContent = `SEARCH — ${CFG.weatherCity.toUpperCase()} READY`;
    await fetchWeather();
  } catch (err) {
    console.error('[STORM] Location search failed:', err.message);
    document.getElementById('mode-label').textContent = 'SEARCH — FAILED TO RESOLVE LOCATION';
  }
}

// Wind direction degrees → compass
function degToCompass(deg) {
  const dirs = ['N','NE','E','SE','S','SW','W','NW'];
  return dirs[Math.round(deg / 45) % 8];
}

// ── Data Fetch ───────────────────────────────────────────────────────────────
async function fetchWeather() {
  try {
    const url = CFG.openMeteoUrl(CFG.weatherLat, CFG.weatherLon);
    const res  = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    const cur  = json.current;
    STATE.weather = {
      temp:      Math.round(cur.temperature_2m),
      code:      cur.weathercode,
      wind:      Math.round(cur.windspeed_10m),
      windDir:   Math.round(cur.winddirection_10m),
    };
    updateWeatherHUD();
    updateWeatherGlobe();
  } catch (err) {
    console.error('[STORM] Weather fetch failed:', err.message);
    document.getElementById('w-cond').textContent = 'FETCH ERROR';
  }
}

async function fetchQuakes() {
  try {
    const res  = await fetch(CFG.usgsUrl);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    STATE.quakes = (json.features ?? []).slice(0, CFG.gridCols * CFG.gridRows);
    updateQuakeHUD();
    if (STATE.gridAnchored) buildQuakeGrid();
  } catch (err) {
    console.error('[STORM] Quake fetch failed:', err.message);
    document.getElementById('q-place').textContent = 'FETCH ERROR';
  }
}

async function fetchAll() {
  await Promise.all([fetchWeather(), fetchQuakes()]);
  const now = new Date();
  document.getElementById('last-update').textContent =
    `LAST UPDATE: ${now.toLocaleTimeString()}`;
}

// ── HUD Updates ──────────────────────────────────────────────────────────────
function updateWeatherHUD() {
  const w = STATE.weather;
  if (!w) return;
  document.getElementById('w-temp').textContent  = `${w.temp}°C`;
  document.getElementById('w-cond').textContent  = `${wmoToString(w.code)} · ${CFG.weatherCity.toUpperCase()}`;
  document.getElementById('w-wind').textContent  = `${w.wind} km/h`;
  document.getElementById('w-dir').textContent   = degToCompass(w.windDir);
}

function updateQuakeHUD() {
  if (!STATE.quakes.length) return;
  const latest = STATE.quakes[0].properties;
  document.getElementById('q-mag').textContent   = `M ${latest.mag.toFixed(1)}`;
  document.getElementById('q-place').textContent = (latest.place ?? 'Unknown').substring(0, 28);
  document.getElementById('q-depth').textContent = `${Math.round(STATE.quakes[0].geometry.coordinates[2])} km`;
  document.getElementById('q-count').textContent = `${STATE.quakes.length} events (24h)`;
}

// ── weather-globe 3D update ───
function updateWeatherGlobe() {
  const w = STATE.weather;
  if (!w) return;
  const icon = wmoToIcon(w.code);
  const isThunderstorm = w.code >= 95;

  document.getElementById('wg-sun').setAttribute('visible',   icon === 'sun');
  document.getElementById('wg-cloud').setAttribute('visible', icon === 'cloud');
  document.getElementById('wg-cloud-right').setAttribute('visible', icon === 'cloud');
  document.getElementById('wg-rain').setAttribute('visible',  icon === 'rain');
  document.getElementById('wg-lightning').setAttribute('visible', isThunderstorm);

  document.getElementById('wg-temp-label').setAttribute('value', `${w.temp}°C`);
  document.getElementById('wg-cond-label').setAttribute('value', wmoToString(w.code));
}

// ── quake-grid 3D build ──────────────────────────────────────────────────────
function depthColor(depth) {
  if (depth < CFG.depthShallow) return '#00ff44';
  if (depth < CFG.depthMid)     return '#ffaa00';
  return '#ff3300';
}

function buildQuakeGrid() {
  const root = document.getElementById('quake-grid-root');
  // Clear previous children
  while (root.firstChild) root.removeChild(root.firstChild);

  const cols = CFG.gridCols;
  const rows = CFG.gridRows;
  const cs   = CFG.cellSize;
  const w    = cols * cs;
  const h    = rows * cs;
  const ox   = -w / 2 + cs / 2;
  const oz   = -h / 2 + cs / 2;

  // ── Grid lines ──
  for (let i = 0; i <= cols; i++) {
    const x = -w / 2 + i * cs;
    const line = document.createElement('a-box');
    line.setAttribute('color', '#00ff88');
    line.setAttribute('opacity',  '0.4');
    line.setAttribute('width',    '0.005');
    line.setAttribute('height',   '0.005');
    line.setAttribute('depth',    `${h}`);
    line.setAttribute('position', `${x} 0 0`);
    line.setAttribute('material', 'color:#00ff88;emissive:#00ff88;emissiveIntensity:0.3;opacity:0.5;transparent:true');
    root.appendChild(line);
  }
  for (let j = 0; j <= rows; j++) {
    const z = -h / 2 + j * cs;
    const line = document.createElement('a-box');
    line.setAttribute('color', '#00ff88');
    line.setAttribute('width',    `${w}`);
    line.setAttribute('height',   '0.005');
    line.setAttribute('depth',    '0.005');
    line.setAttribute('position', `0 0 ${z}`);
    line.setAttribute('material', 'color:#00ff88;emissive:#00ff88;emissiveIntensity:0.3;opacity:0.5;transparent:true');
    root.appendChild(line);
  }

  // ── Floor plane (semi-transparent) ──
  const floor = document.createElement('a-plane');
  floor.setAttribute('rotation',  '0 0 0');
  floor.setAttribute('width',     `${w}`);
  floor.setAttribute('height',    `${h}`);
  floor.setAttribute('color',     '#001a0d');
  floor.setAttribute('material',  'opacity:0.35;transparent:true;side:double');
  floor.setAttribute('position',  '0 -0.002 0');
  root.appendChild(floor);

  // ── Earthquake spheres ──
  STATE.quakes.forEach((feature, idx) => {
    const props = feature.properties;
    const geo   = feature.geometry.coordinates; // [lon, lat, depth]
    const mag   = props.mag   ?? 1;
    const depth = geo[2]      ?? 10;
    const place = (props.place ?? 'Unknown').substring(0, 20);

    const col = Math.floor(idx % cols);
    const row = Math.floor(idx / cols);
    if (row >= rows) return;

    const cx = ox + col * cs;
    const cz = oz + row * cs;
    const r  = Math.max(0.015, mag * CFG.sphereScale);

    const sphere = document.createElement('a-sphere');
    sphere.setAttribute('radius',   `${r}`);
    sphere.setAttribute('position', `${cx} ${r} ${cz}`);
    sphere.setAttribute('color',    depthColor(depth));
    sphere.setAttribute('material',
      `emissive:${depthColor(depth)};emissiveIntensity:0.45;metalness:0.2;roughness:0.5`);

    // pulse animation — larger quakes pulse slower
    const pulseDur = Math.max(600, 2000 - mag * 150);
    sphere.innerHTML = `
      <a-animation attribute="scale"
        from="1 1 1" to="1.18 1.18 1.18"
        dur="${pulseDur}"
        direction="alternate"
        repeat="indefinite"
        easing="easeInOutSine">
      </a-animation>`;

    // label
    const label = document.createElement('a-text');
    label.setAttribute('value',    `M${mag.toFixed(1)}\n${Math.round(depth)}km`);
    label.setAttribute('align',    'center');
    label.setAttribute('color',    '#ffffff');
    label.setAttribute('width',    '0.6');
    label.setAttribute('position', `0 ${r * 2 + 0.04} 0`);
    label.setAttribute('look-at',  '[camera]');
    sphere.appendChild(label);

    root.appendChild(sphere);
  });

  root.setAttribute('visible', 'true');
}

// ── Mode Toggle ──────────────────────────────────────────────────────────────
function toggleMode() {
  if (STATE.mode === 'marker') {
    setMode('markerless');
  } else {
    setMode('marker');
  }
}

function setMode(mode) {
  STATE.mode = mode;
  const sceneMarker      = document.getElementById('scene-marker');
  const sceneMarkerless  = document.getElementById('scene-markerless');
  const modeLabel        = document.getElementById('mode-label');
  const toggleBtn        = document.getElementById('mode-toggle');
  const tapHint          = document.getElementById('tap-hint');
  const legend           = document.getElementById('quake-legend');

  if (mode === 'marker') {
    sceneMarker.style.display     = '';
    sceneMarkerless.style.display = 'none';
    modeLabel.textContent         = 'MODE: WEATHER-GLOBE — AIM AT HIRO MARKER';
    toggleBtn.textContent         = '⇄ QUAKE-GRID';
    tapHint.style.display         = 'none';
    legend.style.display          = 'none';
    STATE.gridAnchored            = false;
    document.getElementById('enter-ar-btn').style.display = 'none';

    cleanupMarkerless();
  } else {
    sceneMarker.style.display     = 'none';
    sceneMarkerless.style.display = '';
    modeLabel.textContent         = 'MODE: QUAKE-GRID — TAP TO ANCHOR';
    toggleBtn.textContent         = '⇄ WEATHER-GLOBE';
    tapHint.style.display         = 'block';
    legend.style.display          = 'block';

    initMarkerless();
  }
}

// ── Markerless — WebXR immersive-ar + hit-test (Three.js) ────────────────────
// IMPORTANT: navigator.xr.requestSession() MUST be called directly inside a
// user-gesture handler with NO awaits before it. This uses a two-phase pattern:
//   Phase 1 (initMarkerless): pre-load Three.js + check support in background
//   Phase 2 (_enterARSession): called from "ENTER AR" button click — calls
//                              requestSession() with nothing awaited before it.

let _xrSession      = null;
let _xrRefSpace     = null;
let _xrHitSrc       = null;
let _xrRenderer     = null;
let _xrScene        = null;
let _xrCamera       = null;
let _xrReticle      = null;
let _xrGridGroup    = null;
let _xrLastPose     = null;
let _threeReady     = false;   // true once Three.js is loaded

// Phase 1: called when mode switches — pre-loads Three.js, checks support
async function initMarkerless() {
  const label    = document.getElementById('mode-label');
  const hint     = document.getElementById('tap-hint');
  const enterBtn = document.getElementById('enter-ar-btn');

  hint.style.display     = 'none';
  enterBtn.style.display = 'none';
  label.textContent      = 'CHECKING WEBXR SUPPORT…';

  // Check WebXR availability first (no await needed — it’s fast)
  if (!navigator.xr) {
    label.textContent = 'WEBXR NOT AVAILABLE — OPEN IN CHROME ON ANDROID';
    return;
  }

  const supported = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
  if (!supported) {
    label.textContent = 'IMMERSIVE-AR NOT SUPPORTED — ARCORE REQUIRED';
    return;
  }

  label.textContent = _threeReady ? 'READY — TAP ENTER AR' : 'LOADING THREE.JS…';

  // Load Three.js if not already done
  if (!window.THREE) {
    try {
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js';
        s.onload = res; s.onerror = rej;
        document.head.appendChild(s);
      });
      _threeReady = true;
    } catch(e) {
      label.textContent = 'FAILED TO LOAD THREE.JS — CHECK CONNECTION';
      return;
    }
  } else {
    _threeReady = true;
  }

  // Show the ENTER AR button — user tapping it IS the user gesture
  label.textContent      = 'READY — TAP ENTER AR BUTTON BELOW';
  enterBtn.style.display = 'block';
}

// Phase 2: called DIRECTLY from the "ENTER AR" button onclick — NO awaits before requestSession
function _enterARSession() {
  const label    = document.getElementById('mode-label');
  const enterBtn = document.getElementById('enter-ar-btn');
  enterBtn.style.display = 'none';
  label.textContent = 'STARTING AR SESSION…';

  if (!_threeReady || !window.THREE) {
    label.textContent = 'THREE.JS NOT READY — SWITCH MODE AND TRY AGAIN';
    return;
  }

  // ── requestSession called DIRECTLY with no preceding awaits — user gesture intact ──
  navigator.xr.requestSession('immersive-ar', {
    requiredFeatures: ['hit-test'],
    optionalFeatures: ['dom-overlay'],
    domOverlay: { root: document.body }
  }).then(session => {
    _xrSession = session;
    _setupXRRenderer(session, window.THREE);
  }).catch(e => {
    label.textContent = 'AR SESSION FAILED: ' + e.message;
    enterBtn.style.display = 'block'; // let them retry
  });
}

// Sets up Three.js renderer + scene after session is granted
function _setupXRRenderer(session, THREE) {
  const label  = document.getElementById('mode-label');
  const hint   = document.getElementById('tap-hint');
  const canvas = document.getElementById('xr-canvas');

  _xrRenderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  _xrRenderer.setPixelRatio(window.devicePixelRatio);
  _xrRenderer.setSize(window.innerWidth, window.innerHeight);
  _xrRenderer.xr.enabled = true;
  _xrRenderer.xr.setReferenceSpaceType('local');

  _xrRenderer.xr.setSession(session).then(() => {
    // Scene
    _xrScene = new THREE.Scene();
    _xrCamera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
    _xrScene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const sun = new THREE.DirectionalLight(0xffffff, 0.6);
    sun.position.set(1, 3, 2);
    _xrScene.add(sun);

    // Reticle ring (flat on floor)
    const ringGeo = new THREE.RingGeometry(0.10, 0.15, 36);
    ringGeo.applyMatrix4(new THREE.Matrix4().makeRotationX(-Math.PI / 2));
    _xrReticle = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide }));
    _xrReticle.visible = false;
    _xrScene.add(_xrReticle);

    // Grid group (invisible until placed)
    _xrGridGroup = new THREE.Group();
    _xrGridGroup.visible = false;
    _xrScene.add(_xrGridGroup);

    // Hit-test source — using viewer reference space
    session.requestReferenceSpace('viewer').then(vs => {
      session.requestHitTestSource({ space: vs }).then(src => {
        _xrHitSrc = src;
      }).catch(e => console.warn('[STORM] hit-test src failed:', e));
    }).catch(e => console.warn('[STORM] viewer space failed:', e));

    // Local reference space for pose queries
    session.requestReferenceSpace('local').then(rs => {
      _xrRefSpace = rs;
    }).catch(e => {
      console.warn('[STORM] local ref space failed:', e);
      label.textContent = 'REF SPACE FAILED: ' + e.message;
    });

    // Tap to place — XR select event
    session.addEventListener('select', _onXRSelect);
    session.addEventListener('end', () => {
      _xrSession = null;
      label.textContent = 'AR SESSION ENDED — SWITCH MODE TO RESTART';
    });

    hint.textContent   = 'POINT AT FLOOR — TAP TO PLACE QUAKE-GRID';
    hint.style.display = 'block';
    label.textContent  = 'WEBXR ACTIVE — AIM CAMERA AT FLAT SURFACE';

    // Render loop
    _xrRenderer.setAnimationLoop((time, frame) => {
      if (!frame || !_xrRefSpace) return;

      if (_xrHitSrc && !STATE.gridAnchored) {
        const hits = frame.getHitTestResults(_xrHitSrc);
        if (hits.length > 0) {
          const pose = hits[0].getPose(_xrRefSpace);
          if (pose) {
            const m = new THREE.Matrix4().fromArray(pose.transform.matrix);
            _xrReticle.visible = true;
            _xrReticle.position.setFromMatrixPosition(m);
            _xrReticle.quaternion.setFromRotationMatrix(m);
            _xrLastPose = _xrReticle.position.clone();
          }
        } else {
          _xrReticle.visible = false;
        }
      }

      _xrRenderer.render(_xrScene, _xrCamera);
    });

  }).catch(e => {
    label.textContent = 'RENDERER XR SETUP FAILED: ' + e.message;
  });
}

function _onXRSelect() {
  if (STATE.gridAnchored) return;
  STATE.gridAnchored = true;

  // Use reticle pos if we have one; fallback: 1.5 m in front of camera
  let placePos;
  if (_xrLastPose) {
    placePos = _xrLastPose.clone();
  } else {
    // Place 1.5 m in front of current camera position
    const camPos = new window.THREE.Vector3();
    _xrCamera.getWorldPosition(camPos);
    const forward = new window.THREE.Vector3(0, 0, -1.5).applyQuaternion(_xrCamera.quaternion);
    placePos = camPos.add(forward);
    placePos.y -= 0.3; // slightly below eye level
  }

  _xrGridGroup.position.copy(placePos);
  _xrGridGroup.visible = true;
  _xrReticle.visible   = false;

  _buildQuakeGridXR(window.THREE);

  document.getElementById('tap-hint').style.display = 'none';
  document.getElementById('mode-label').textContent  = 'QUAKE-GRID ANCHORED — MOVE TO EXPLORE';
}

function _buildQuakeGridXR(THREE) {
  while (_xrGridGroup.children.length) _xrGridGroup.remove(_xrGridGroup.children[0]);

  const cols = CFG.gridCols;
  const rows = CFG.gridRows;
  const cs   = CFG.cellSize * 0.4;   // scale down for real-world metres
  const w = cols * cs, h = rows * cs;
  const ox = -w / 2 + cs / 2, oz = -h / 2 + cs / 2;

  // Semi-transparent floor plane
  const floorMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ color: 0x001a0d, transparent: true, opacity: 0.4, side: THREE.DoubleSide })
  );
  floorMesh.rotation.x = -Math.PI / 2;
  _xrGridGroup.add(floorMesh);

  // Grid lines
  const lineMat = new THREE.LineBasicMaterial({ color: 0x00ff88 });
  for (let i = 0; i <= cols; i++) {
    const x = -w / 2 + i * cs;
    _xrGridGroup.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(x, 0.002, -h / 2),
        new THREE.Vector3(x, 0.002,  h / 2)
      ]), lineMat
    ));
  }
  for (let j = 0; j <= rows; j++) {
    const z = -h / 2 + j * cs;
    _xrGridGroup.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-w / 2, 0.002, z),
        new THREE.Vector3( w / 2, 0.002, z)
      ]), lineMat
    ));
  }

  // Earthquake spheres
  STATE.quakes.forEach((feature, idx) => {
    const props = feature.properties;
    const geo   = feature.geometry.coordinates;
    const mag   = props.mag ?? 1;
    const depth = geo[2]   ?? 10;
    const col   = idx % cols;
    const row   = Math.floor(idx / cols);
    if (row >= rows) return;

    const hexColor = depth < CFG.depthShallow ? 0x00ff44 : depth < CFG.depthMid ? 0xffaa00 : 0xff3300;
    const r = Math.max(0.015, mag * CFG.sphereScale * 0.4);
    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(r, 12, 12),
      new THREE.MeshStandardMaterial({ color: hexColor, emissive: hexColor, emissiveIntensity: 0.5, roughness: 0.4 })
    );
    sphere.position.set(ox + col * cs, r, oz + row * cs);
    _xrGridGroup.add(sphere);
  });
}

function cleanupMarkerless() {
  const canvas = document.getElementById('xr-canvas');
  if (canvas) {
    canvas.removeEventListener('touchend', _onXRSelect);
    canvas.removeEventListener('click',    _onXRSelect);
  }
  if (_xrSession) {
    _xrSession.removeEventListener('select', _onXRSelect);
    _xrSession.end().catch(() => {});
    _xrSession = null;
  }
  if (_xrRenderer) {
    _xrRenderer.setAnimationLoop(null);
    _xrRenderer.dispose();
    _xrRenderer = null;
  }
  _xrRefSpace = _xrHitSrc = _xrScene = _xrCamera = _xrReticle = _xrGridGroup = _xrLastPose = null;
  STATE.gridAnchored = false;
}

// ── Boot ─────────────────────────────────────────────────────────────────────
(function boot() {
  // Initial fetch
  fetchAll();

  // Polling every 30s
  setInterval(fetchAll, CFG.updateIntervalMs);

  const searchInput = document.getElementById('location-search');
  const searchBtn = document.getElementById('location-search-btn');
  if (searchInput) {
    searchInput.value = CFG.weatherCity || 'Colombo';
    searchInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        searchLocation();
      }
    });
  }
  if (searchBtn) {
    searchBtn.addEventListener('click', searchLocation);
  }

  // Start in marker mode
  setMode('marker');

  // A-Frame marker tracking → update weather-globe on marker found
  window.addEventListener('load', () => {
    const scene = document.getElementById('scene-marker');
    const marker = document.getElementById('hiro-marker');
    if (scene) {
      scene.addEventListener('camera-init', () => {
        document.getElementById('mode-label').textContent = 'CAMERA READY — SEARCHING FOR HIRO MARKER';
      });
      scene.addEventListener('camera-error', () => {
        document.getElementById('mode-label').textContent = 'CAMERA ERROR — CHECK PERMISSION OR CAMERA USE';
      });
    }
    if (marker) {
      marker.addEventListener('markerFound',  () => {
        document.getElementById('mode-label').textContent = 'MARKER LOCKED — WEATHER-GLOBE ACTIVE';
      });
      marker.addEventListener('markerLost',   () => {
        document.getElementById('mode-label').textContent = 'MODE: WEATHER-GLOBE — AIM AT HIRO MARKER';
      });
    }
  });
})();
</script>
